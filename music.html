<!DOCTYPE html>

<head>

  <title>Music — The Ritual</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="stylesheet" href="style.css" />

<body>

  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link">
        <img src="img/logo.PNG" alt="The Ritual" class="header-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">

        <a href="artists.html">Artists</a>
        <a href="music.html" class="nav-active">Music</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- MUSIC -->
  <section class="music-section page-section" id="music">
    <div class="music-inner">
      <div class="music-text">
        <h2 class="section-title">Music</h2>
        <div class="rule"></div>
        <p>The Ritual will perform at special events, festivals and tours. The concerts will be theatrical performances with the artwork and characters from the game on stage.</p>
      </div>
      <div class="music-media">
        <div class="music-image">
          <img src="img/band.jpeg" alt="The Ritual band" />
        </div>
        <div class="music-video">
          <video src="img/clip.mp4" controls playsinline preload="metadata"></video>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="img/logo.PNG" alt="The Ritual" class="footer-logo" />
      <div class="footer-copy">
        <p>© 2026 The Ritual.</p>
        <p class="footer-dev">Developed by Álefe Paes Leme</p>
      </div>
      <div class="footer-social">
        <a href="#" class="social-btn" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>

        <a href="#" class="social-btn" aria-label="X">
