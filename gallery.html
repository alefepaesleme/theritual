<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — The Ritual</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://use.typekit.net/tyx0ola.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link">
        <img src="img/logo.PNG" alt="The Ritual" class="header-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="gallery.html" class="nav-active">Gallery</a>
        <a href="artists.html">Artists</a>
        <a href="music.html">Music</a>
        <a href="contact.html">Contact</a>
        <a href="#" class="nav-discord-btn" target="_blank" rel="noopener noreferrer">Join our Discord community</a>
      </nav>
    </div>
  </header>

  <!-- GALLERY -->
  <section class="tribes-section page-section" id="gallery">
    <div class="section-header">
      <h2 class="section-title">Gallery</h2>
    </div>

    <div class="tribes-grid">

      <div class="tribe-card" data-tribe="0">
        <img src="img/dei_septenarius_cover.png" alt="Dei Septenarius" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">Dei Septenarius</div>
      </div>

      <div class="tribe-card" data-tribe="1">
        <img src="img/the_agmen_of_ymir_cover.png" alt="The Agmen of Ymir" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">The Agmen of Ymir</div>
      </div>

      <div class="tribe-card" data-tribe="2">
        <img src="img/the_odollam_cover.png" alt="The Odollam" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">The Odollam</div>
      </div>

      <div class="tribe-card" data-tribe="3">
        <img src="img/the_sahraa_ov_sahhar_cover.png" alt="The Sahraa ov Sahhar" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">The Sahraa ov Sahhar</div>
      </div>

      <div class="tribe-card" data-tribe="4">
        <img src="img/THE_ALCAZAR_OF_ORGONE_cover.png" alt="The Alcazar of Orgone" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">The Alcazar of Orgone</div>
      </div>

      <div class="tribe-card" data-tribe="5">
        <img src="img/the_panteon_of_ammarik_cover.png" alt="The Panteon of Ammarik" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">The Panteon of Ammarik</div>
      </div>

      <div class="tribe-card" data-tribe="6">
        <img src="img/polaris_elders_cover.png" alt="Polaris, Elders" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">Polaris, Elders</div>
      </div>

      <div class="tribe-card" data-tribe="7">
        <img src="img/hell_cover.png" alt="Gates ov Hell" />
        <div class="tribe-overlay"></div>
        <div class="tribe-label">Gates ov Hell</div>
      </div>

    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <button class="lightbox-arrow prev" id="lightboxPrev" aria-label="Previous">&#8592;</button>
    <button class="lightbox-arrow next" id="lightboxNext" aria-label="Next">&#8594;</button>
    <div class="lightbox-slides" id="lightboxSlides"></div>
    <div class="lightbox-info">
      <h2 class="lightbox-title" id="lightboxTitle"></h2>
      <div class="lightbox-dots" id="lightboxDots"></div>
    </div>
  </div>
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="img/logo.PNG" alt="The Ritual" class="footer-logo" />
      <div class="footer-copy">
        <p>© 2026 The Ritual.</p>
        <p class="footer-dev">Developed by Álefe Paes Leme</p>
      </div>
      <div class="footer-social">
        <a href="#" class="social-btn" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="#" class="social-btn" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
