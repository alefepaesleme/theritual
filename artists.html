<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artists — The Ritual</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://use.typekit.net/tyx0ola.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link">
        <img src="img/logo.PNG" alt="The Ritual" class="header-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="gallery.html">Gallery</a>
        <a href="artists.html" class="nav-active">Artists</a>
        <a href="music.html">Music</a>
        <a href="contact.html">Contact</a>
        <a href="#" class="nav-discord-btn" target="_blank" rel="noopener noreferrer">Join our Discord community</a>
      </nav>
    </div>
  </header>

  <!-- ARTISTS -->
  <section class="artists-section page-section" id="artists">
    <div class="section-header centered">
      <h2 class="section-title">Artists</h2>
    </div>

    <div class="artists-wrap" id="artistsWrap">
      <div class="artists-grid" id="artistsGrid">

        <div class="artists-row artists-row-top">
          <div class="artist-card" data-artist="0">
            <div class="artist-img-wrap">
              <img src="img/king_ov_hell.png" alt="King ov Hell" />
            </div>
            <div class="artist-name">King ov Hell</div>
          </div>
          <div class="artist-card" data-artist="1">
            <div class="artist-img-wrap">
              <img src="img/mothmeister.png" alt="Mothmeister" />
            </div>
            <div class="artist-name">Mothmeister</div>
          </div>
        </div>

        <div class="artists-row artists-row-bottom">
          <div class="artist-card" data-artist="2">
            <div class="artist-img-wrap">
              <img src="img/vincent_castiglia.png" alt="Vincent Castiglia" />
            </div>
            <div class="artist-name">Vincent Castiglia</div>
          </div>
          <div class="artist-card" data-artist="3">
            <div class="artist-img-wrap">
              <img src="img/jolie_perez.png" alt="Jolie Perez" />
            </div>
            <div class="artist-name">Jolie Perez</div>
          </div>
        </div>

      </div>

      <div class="artist-detail" id="artistDetail">
        <button class="artist-detail-close" id="artistDetailClose" aria-label="Close">✕</button>
        <h3 id="artistDetailName"></h3>
        <div class="artist-detail-role" id="artistDetailRole"></div>
        <p id="artistDetailText"></p>
        <a class="artist-instagram" id="artistInstagram" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="img/logo.PNG" alt="The Ritual" class="footer-logo" />
      <div class="footer-copy">
        <p>© 2026 The Ritual.</p>
        <p class="footer-dev">Developed by Álefe Paes Leme</p>
      </div>
      <div class="footer-social">
        <a href="#" class="social-btn" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="#" class="social-btn" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
