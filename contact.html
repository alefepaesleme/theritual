<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Ritual</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://use.typekit.net/tyx0ola.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link">
        <img src="img/logo.PNG" alt="The Ritual" class="header-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="gallery.html">Gallery</a>
        <a href="artists.html">Artists</a>
        <a href="music.html">Music</a>
        <a href="contact.html" class="nav-active">Contact</a>
        <a href="#" class="nav-discord-btn" target="_blank" rel="noopener noreferrer">Join our Discord community</a>
      </nav>
    </div>
  </header>

  <!-- CONTACT -->
  <section class="contact-section page-section" id="contact">
    <div class="contact-inner">
      <div class="contact-text">
        <h2 class="section-title">Contact</h2>
        <div class="rule"></div>
        <p>If you want to contact us.</p>
      </div>
      <form class="contact-form" id="contactForm" name="contact" method="POST" data-netlify="true" novalidate>
        <input type="hidden" name="form-name" value="contact" />
        <div class="form-row">
          <div class="form-group">
            <label for="fname">Name</label>
            <input type="text" id="fname" name="name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="femail">E-mail</label>
            <input type="email" id="femail" name="email" placeholder="your@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="fphone">Phone</label>
          <input type="tel" id="fphone" name="phone" placeholder="+1 (000) 000-0000" />
        </div>
        <div class="form-group">
          <label for="fmessage">Message</label>
          <textarea id="fmessage" name="message" rows="5" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit" class="btn-spark" id="btnSend">
          <span>Send</span>
          <canvas class="spark-canvas" id="sparkSend"></canvas>
        </button>
        <p class="form-success" id="formSuccess">Your message has been received. The darkness awaits.</p>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="img/logo.PNG" alt="The Ritual" class="footer-logo" />
      <div class="footer-copy">
        <p>© 2026 The Ritual.</p>
        <p class="footer-dev">Developed by Álefe Paes Leme</p>
      </div>
      <div class="footer-social">
        <a href="#" class="social-btn" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="#" class="social-btn" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
